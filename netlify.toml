[build]
  # Publish directory (where your static files are)
  publish = "veetaa-proto/veetaa-frontend"
  
  # Build command (if using Vite or any build tool)
  command = "cd veetaa-proto/veetaa-frontend && npm install && npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirects for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
